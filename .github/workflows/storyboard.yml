name: Storyboard compositor
on:
  pull_request:
    paths: ['scripts/**', 'tests/**', '.github/workflows/storyboard.yml']
  push:
    branches: [main]
    paths: ['scripts/**', 'tests/**', '.github/workflows/storyboard.yml']
permissions:
  contents: read
jobs:
  pillow:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.10', '3.14']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r scripts/requirements-storyboard.txt
      - run: python -m unittest discover -s tests -v
      - name: Check non-Windows PowerShell diagnostic
        if: runner.os != 'Windows'
        shell: pwsh
        run: |
          try {
            & ./scripts/compose-nine-shot-storyboard.ps1 -Sources (1..9 | ForEach-Object { "shot$_.png" }) -OutputDir out -Prefix test
            throw 'Expected a Windows-only diagnostic'
          } catch {
            if ($_.Exception.Message -notlike '*supports Windows only*') { throw }
          }
